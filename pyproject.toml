[project]
name = "mechlab"
version = "0.2.4"
description = "Computational Mechanical Engineering Toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Sewak Sunar", email = "sewaksunar@hotmail.com" }
]

keywords = [
  "mechanical-engineering",
  "thermodynamics",
  "fluid-mechanics",
  "control-systems",
  "engineering",
  "scientific-computing"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "colorama==0.4.6",
  "contourpy==1.3.3",
  "control==0.10.2",
  "coolprop==7.2.0",
  "cycler==0.12.1",
  "flexcache==0.3",
  "flexparser==0.4",
  "fluids==1.3.0",
  "fonttools==4.61.1",
  "kiwisolver==1.4.9",
  "matplotlib==3.10.8",
  "mpmath==1.3.0",
  "numpy==2.4.1",
  "packaging==26.0",
  "pillow==12.1.0",
  "pint==0.25.2",
  "platformdirs==4.5.1",
  "plotly>=6.5.2",
  "pycairo>=1.29.0",
  "pygments==2.19.2",
  "pyparsing==3.3.2",
  "python-dateutil==2.9.0.post0",
  "rich>=13.0.0",
  "scipy==1.17.0",
  "six==1.17.0",
  "sympy==1.14.0",
  "typing-extensions==4.15.0",
]

[project.urls]
Homepage = "https://github.com/sewaksunar/mechlab"
Documentation = "https://sewaksunar.github.io/mechlab/"
Repository = "https://github.com/sewaksunar/mechlab.git"
Issues = "https://github.com/sewaksunar/mechlab/issues"

[project.scripts]
mechlab = "mechlab.cli.__main__:main"
dev = "scripts:docs_dev"

# -----------------------------
# Dependency groups (uv style)
# -----------------------------

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "iniconfig==2.3.0",
  "pluggy==1.6.0"
]

docs = [
  "sphinx>=9.1.0,<10.0.0",
  "sphinx-autodoc-typehints>=3.6.2,<4.0.0",
  "furo>=2025.12.19,<2026.0.0",
  "myst-parser>=5.0.0,<6.0.0",
  "sphinx-design>=0.7.0,<0.8.0",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "sphinx-autobuild>=2025.8.25,<2026.0.0"
]

# -----------------------------
# Build system (uv-compatible)
# -----------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
interactive = ["ipython", "ipywidgets", "matplotlib"]
