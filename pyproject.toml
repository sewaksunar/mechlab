[project]
name = "mechlab"
version = "0.1.0"
description = "Computational Mechanical Engineering Toolkit"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "colorama (==0.4.6)",
    "contourpy (==1.3.3)",
    "control (==0.10.2)",
    "coolprop (==7.2.0)",
    "cycler (==0.12.1)",
    "flexcache (==0.3)",
    "flexparser (==0.4)",
    "fluids (==1.3.0)",
    "fonttools (==4.61.1)",
    "iniconfig (==2.3.0)",
    "kiwisolver (==1.4.9)",
    "matplotlib (==3.10.8)",
    "mpmath (==1.3.0)",
    "numpy (==2.4.1)",
    "packaging (==26.0)",
    "pillow (==12.1.0)",
    "pint (==0.25.2)",
    "platformdirs (==4.5.1)",
    "pluggy (==1.6.0)",
    "pygments (==2.19.2)",
    "pyparsing (==3.3.2)",
    "pytest (==9.0.2)",
    "python-dateutil (==2.9.0.post0)",
    "scipy (==1.17.0)",
    "six (==1.17.0)",
    "sympy (==1.14.0)",
    "typing-extensions (==4.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
