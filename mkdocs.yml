site_name: MechLab
site_description: A modular, object-oriented engineering mechanics library for structural analysis
site_url: https://sewaksunar.github.io/mechlab/
repo_name: sewaksunar/mechlab
repo_url: https://github.com/sewaksunar/mechlab
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Sewak Sunar

theme:
  name: material
  language: en

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow

    - search.highlight
    - search.suggest

    - content.code.copy
    - content.code.annotate
    - content.tooltips

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table

            merge_init_into_class: true
            members_order: source

            show_source: true
            show_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_full_path: false

            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

            inherited_members: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli.md

  - User Guide:
      - Tutorial:
          - Machine Design: tutorial/MachineDesign.md

  - Developer Guide:
      - Architecture: architecture.md
      - Project Guide: project-guide.md

  - API Reference:
      - Domain: reference/domain.md
      - Engine: reference/engine.md
      - Application: reference/application.md
      - Interfaces: reference/interfaces.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - abbr
  - def_list

  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.arithmatex:
      generic: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sewaksunar/mechlab

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js